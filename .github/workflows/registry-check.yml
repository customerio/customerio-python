name: Check PyPI release

# The publish job waits for an approval, so the wait starts when that workflow
# finishes, not when the release is published. release-please also creates
# releases with GITHUB_TOKEN, which fires no `release` event to listen for.
on:
  workflow_run:
    workflows: [Publish to PyPI]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Version to look for on PyPI (use a fake one to test the alert)
        required: true
        type: string

permissions:
  contents: read
  # To read the jobs of the publish run.
  actions: read

jobs:
  check:
    name: Confirm version is on PyPI
    # Runs after every publish run, failed and cancelled ones too. The release
    # already exists by then, and a failed publish can still have uploaded the
    # package, so the registry is the only way to tell. The tag check below
    # filters out pushes that released nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Secrets cannot be read in step conditions, so expose it here and test the env var.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFY_RELEASES_WEBHOOK_URL }}
      PYPI_DIST: customerio
      # Poll every 3 minutes for about 50 minutes.
      MAX_ATTEMPTS: "17"
      SLEEP_SECONDS: "180"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so release tags are available.
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Work out which version to look for
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          PUBLISH_EVENT: ${{ github.event.workflow_run.event }}
          # For a publish run started by a release, head_branch is the release tag.
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          GH_TOKEN: ${{ github.token }}
        run: |
          check=true
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$VERSION_INPUT"
          elif [ "$PUBLISH_EVENT" = "release" ]; then
            tag="$RELEASE_TAG"
          else
            # Most pushes to main release nothing. A run released the nearest tag
            # when its commit carries that tag, or when the release was published
            # while it ran: overlapping pushes can make a later run create an
            # earlier release, so the tag then sits on an ancestor of this commit.
            tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
            tagged=""
            published_at=""
            if [ -n "$tag" ]; then
              tagged=$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)
              published_at=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .published_at 2>/dev/null || true)
            fi
            # A failed API call prints its error body, so keep only a real timestamp.
            if ! printf '%s' "$published_at" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$'; then
              published_at=""
            fi
            # A run that ended cleanly with its publish job skipped released
            # nothing itself, even when another run has since tagged its commit.
            publish_job=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
              --jq '.jobs[] | select(.name == "Build and publish") | .conclusion' 2>/dev/null || true)
            if [ "$RUN_CONCLUSION" = "success" ] && [ "$publish_job" = "skipped" ]; then
              check=false
              echo "The publish job was skipped, nothing to check."
            elif [ -n "$tagged" ] && [ "$tagged" = "$(git rev-parse HEAD)" ]; then
              check=true
            elif [ -n "$tagged" ] && [ -n "$published_at" ] && [ ! "$published_at" \< "$RUN_STARTED_AT" ]; then
              check=true
            else
              check=false
              echo "No release was cut at $(git rev-parse --short HEAD), nothing to check."
            fi
          fi
          version="${tag#v}"
          echo "check=$check" >> "$GITHUB_OUTPUT"
          if [ "$check" = "false" ]; then
            exit 0
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9A-Za-z]+)*([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a valid version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for the version to appear on PyPI
        if: ${{ steps.version.outputs.check == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          url="https://pypi.org/pypi/${PYPI_DIST}/${VERSION}/json"
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)
            echo "attempt $attempt/$MAX_ATTEMPTS: $url returned $status"
            if [ "$status" = "200" ]; then
              echo "${PYPI_DIST} ${VERSION} is on PyPI"
              exit 0
            fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          echo "::error::${PYPI_DIST} ${VERSION} is still missing from PyPI"
          exit 1

      - name: Alert Slack that the version is missing
        if: ${{ failure() && steps.version.outputs.check != 'false' && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        continue-on-error: true
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Python SDK missing from PyPI",
              "username": "Python deployment bot",
              "icon_url": "https://raw.githubusercontent.com/github/explore/main/topics/python/python.png",
              "channel": "#server-sdk-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Python* SDK ${{ steps.version.outputs.version || 'release' }} is not on PyPI 50 minutes after the publish workflow finished :warning:\nThe publish workflow ended as ${{ github.event.workflow_run.conclusion || 'not run' }}. View the <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|CI logs>."
                  }
                }
              ]
            }
