name: Publish to PyPI

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions: {}

jobs:
  release-please:
    name: Open or tag a release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # release-please creates its autorelease labels through the Issues API.
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  # Publishing lives in this file because PyPI trusted publishing is bound to
  # publish.yml. A release created by release-please with GITHUB_TOKEN does not
  # fire the `release` event, so the push run publishes it here instead.
  publish:
    name: Build and publish
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'release' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      # Secrets cannot be read in step conditions, so expose it here and test the env var.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFY_RELEASES_WEBHOOK_URL }}
      TAG_NAME: ${{ needs.release-please.outputs.tag_name || github.event.release.tag_name }}
    steps:
      # Overlapping pushes can make a later run create an earlier release, so
      # build the tagged commit rather than the commit that triggered this run.
      # Full history because the package version comes from the git tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.sha || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build

      # A build that cannot see the tag gets a dev version, which must not ship.
      - name: Check the built version matches the tag
        run: |
          # Python rewrites versions, so v3.3.0-rc.1 builds as 3.3.0rc1.
          version=$(python -c 'import sys; from packaging.version import Version; print(Version(sys.argv[1]))' "$TAG_NAME")
          if ! ls "dist/customerio-${version}.tar.gz" "dist/customerio-${version}-"*.whl; then
            echo "::error::dist/ does not hold version ${version}"
            ls dist
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Notify Slack of published release
        if: ${{ success() && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        continue-on-error: true
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Python SDK ${{ env.TAG_NAME }} published to PyPI",
              "username": "Python deployment bot",
              "icon_url": "https://raw.githubusercontent.com/github/explore/main/topics/python/python.png",
              "channel": "#server-sdk-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Python* SDK ${{ env.TAG_NAME }} published to PyPI. <https://github.com/${{ github.repository }}/releases/tag/${{ env.TAG_NAME }}|View release>"
                  }
                }
              ]
            }

      - name: Notify Slack of failed release
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        continue-on-error: true
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Python SDK release failure",
              "username": "Python deployment bot",
              "icon_url": "https://raw.githubusercontent.com/github/explore/main/topics/python/python.png",
              "channel": "#server-sdk-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Python* SDK release :warning: failure :warning:\nView the <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|CI logs> to see why."
                  }
                }
              ]
            }
