name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    env:
      # Secrets cannot be read in step conditions, so expose it here and test the env var.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFY_RELEASES_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Notify Slack of published release
        if: ${{ success() && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        continue-on-error: true
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Python SDK ${{ github.event.release.tag_name }} published to PyPI",
              "username": "Python deployment bot",
              "icon_url": "https://raw.githubusercontent.com/github/explore/main/topics/python/python.png",
              "channel": "#server-sdk-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Python* SDK ${{ github.event.release.tag_name }} published to PyPI. <${{ github.event.release.html_url }}|View release>"
                  }
                }
              ]
            }

      - name: Notify Slack of failed release
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        continue-on-error: true
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Python SDK release failure",
              "username": "Python deployment bot",
              "icon_url": "https://raw.githubusercontent.com/github/explore/main/topics/python/python.png",
              "channel": "#server-sdk-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Python* SDK release :warning: failure :warning:\nView the <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|CI logs> to see why."
                  }
                }
              ]
            }
